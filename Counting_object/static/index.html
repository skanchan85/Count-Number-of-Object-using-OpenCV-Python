<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Object Count Detection</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;

   }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.85;
    }

    .content {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 25px;
    }

    @media (max-width: 900px) {
      .content {
        grid-template-columns: 1fr;
      }
    }

    /* Preview Section */
    .preview-box {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      border: 2px dashed rgba(255,255,255,0.2);
    }

    .preview-box img,
    .preview-box video {
      max-width: 100%;
      max-height: 280px;
      border-radius: 12px;
      display: none;
    }

    .preview-placeholder {
      text-align: center;
      opacity: 0.8;
    }

    .preview-placeholder span {
      font-size: 3rem;
      display: block;
      margin-bottom: 10px;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
    }

    .card h3 {
      margin-bottom: 15px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .upload-btn {
      display: inline-block;
      padding: 12px 20px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border-radius: 30px;
      color: #fff;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }

    input[type="file"] {
      display: none;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: #000;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }

    /* Result */
    .result {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .count {
      font-size: 2.5rem;
      font-weight: 700;
      color: #00ffcc;
    }

    footer {
      margin-top: 25px;
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Object Count Detection</h1>
      <p>AI-powered system to detect and count objects from images or videos</p>
    </header>

    <div class="content">
      <!-- Preview -->
      <div class="preview-box" id="previewBox">
        <div class="preview-placeholder" id="placeholder">
          <span>📷</span>
          Upload an image or video to preview
        </div>
        <img id="imagePreview" />
        <video id="videoPreview" controls></video>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="card">
          <h3>Upload File</h3>
          <label class="upload-btn">
            Choose Image / Video
            <input type="file" id="fileInput" accept="image/*,video/*" />
          </label>
        </div>

        <div class="card">
          <h3>Detection</h3>
          <button class="action-btn" onclick="detectObjects()">Start Object Detection</button>
        </div>

        <div class="card result">
          <div>
            <h3>Total Objects</h3>
            <p style="font-size:0.85rem; opacity:0.8;">Detected in frame</p>
          </div>
          <div class="count" id="countValue">0</div>
        </div>
      </div>
    </div>

    <footer>
      © 2026 Object Count Detection Using Pyhton-OpenCV | Frontend Demo
    </footer>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const imagePreview = document.getElementById('imagePreview');
    const videoPreview = document.getElementById('videoPreview');
    const placeholder = document.getElementById('placeholder');
    const countValue = document.getElementById('countValue');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      placeholder.style.display = 'none';

      if (file.type.startsWith('image')) {
        videoPreview.style.display = 'none';
        imagePreview.style.display = 'block';
        imagePreview.src = url;
      } else if (file.type.startsWith('video')) {
        imagePreview.style.display = 'none';
        videoPreview.style.display = 'block';
        videoPreview.src = url;
      }
    });

    function detectObjects() {
      // Demo count (replace with backend AI result)
      const randomCount = Math.floor(Math.random() * 20) + 1;
      countValue.textContent = randomCount;
    }
  </script>

</body>
</html>
